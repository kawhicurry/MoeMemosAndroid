name: Build Signed Release APK

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Validate tag format
        run: |
          TAG="${RELEASE_TAG}"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$ ]]; then
            echo "Tag '$TAG' is not supported. Expected formats: 0.9.0, 0.9.0-alpha.0, or 0.9.0-beta.0"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify checked out tag
        run: |
          TAG_COMMIT="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [[ "$HEAD_COMMIT" != "$TAG_COMMIT" ]]; then
            echo "Checked out $HEAD_COMMIT, expected tag $RELEASE_TAG at $TAG_COMMIT"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install NDK for native library stripping
        run: |
          ANDROID_TOOLS="$ANDROID_HOME/cmdline-tools/latest/bin"
          if [[ -x "$ANDROID_TOOLS/android" ]]; then
            "$ANDROID_TOOLS/android" --no-metrics --sdk="$ANDROID_HOME" sdk install "ndk;28.2.13676358"
          else
            "$ANDROID_TOOLS/sdkmanager" --sdk_root="$ANDROID_HOME" "ndk;28.2.13676358"
          fi

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "Missing secret: ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/release.keystore"

      - name: Build signed release APK (universal)
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          for var_name in ANDROID_SIGNING_STORE_FILE ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_ALIAS ANDROID_SIGNING_KEY_PASSWORD; do
            if [[ -z "${!var_name}" ]]; then
              echo "Missing required signing value: ${var_name}"
              exit 1
            fi
          done
          ./gradlew :app:assembleRelease

      - name: Rename APK with tag
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$APK_PATH" ]]; then
            echo "APK not found at $APK_PATH"
            exit 1
          fi
          cp "$APK_PATH" "moememos-v${RELEASE_TAG}.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: moememos-v${{ env.RELEASE_TAG }}
          path: moememos-v${{ env.RELEASE_TAG }}.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: moememos-v${{ env.RELEASE_TAG }}.apk
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
